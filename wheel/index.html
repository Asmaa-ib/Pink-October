<style>
:root{
  --deep:#B42A5C; --rose:#E8618C; --pink:#F7A0B8; --blush:#FDEAF0; --plum:#4A1D33; --sage:#5E8B73; --gold:#C98C6E;
  --head:'El Messiri','Segoe UI',Tahoma,sans-serif; --body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--body); color:var(--plum); min-height:100vh; overflow-x:hidden;
  background:
    radial-gradient(55% 40% at 88% 8%, #FFD3E0 0%, rgba(255,211,224,0) 70%),
    radial-gradient(50% 40% at 8% 92%, #FFC1D3 0%, rgba(255,193,211,0) 70%),
    radial-gradient(40% 30% at 12% 15%, #FFF1DD 0%, rgba(255,241,221,0) 70%),
    linear-gradient(160deg,#FFF6F9 0%,#FDE3EB 55%,#FBD0DD 100%);
  background-attachment:fixed;
}
.page{max-width:980px;margin:0 auto;padding:22px 16px 40px;display:flex;flex-direction:column;align-items:center}
header{display:flex;align-items:center;justify-content:space-between;width:100%;gap:12px}
.org{display:flex;align-items:center;gap:10px}
.org img{height:52px;width:auto}
.org .bar{width:2px;align-self:stretch;background:linear-gradient(180deg,rgba(232,97,140,0),var(--rose),rgba(232,97,140,0))}
.org b{display:block;font-size:13.5px}
.org span{display:block;font-size:12.5px;color:var(--deep);font-weight:500}
.kicker{font-family:'Great Vibes',cursive;color:var(--rose);font-size:26px;direction:ltr;white-space:nowrap}
h1{font-family:'Aref Ruqaa',var(--head);color:var(--deep);font-size:clamp(40px,8vw,64px);line-height:1.25;margin:14px 0 0;text-align:center}
.lead{margin:2px 0 18px;font-size:clamp(15px,3.6vw,18px);font-weight:500;text-align:center}

/* ---------- wheel ---------- */
.stage{position:relative;width:min(92vw,560px);aspect-ratio:1/1;margin-top:18px}
.pointer{position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:62px;height:78px;z-index:3;filter:drop-shadow(0 6px 10px rgba(180,42,92,.35))}
.pointer.tick{animation:tick .12s ease-out}
@keyframes tick{0%{transform:translateX(-50%) rotate(0)}50%{transform:translateX(-50%) rotate(-9deg)}100%{transform:translateX(-50%) rotate(0)}}
#wheel{width:100%;height:100%;display:block;transform:rotate(0deg);will-change:transform;filter:drop-shadow(0 18px 34px rgba(180,42,92,.22))}
#wheel text{font-family:var(--head);font-weight:700}
.hub{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;
  width:27%;aspect-ratio:1/1;border-radius:50%;border:5px solid #E8B9A0;
  background:radial-gradient(circle at 40% 30%,#FFFFFF 0%,#FFF1F5 70%,#FDE1EA 100%);
  box-shadow:0 10px 26px rgba(180,42,92,.30), inset 0 0 0 3px #fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  cursor:pointer;color:var(--deep);font:inherit;padding:0;transition:transform .15s ease, box-shadow .15s ease;
}
.hub:hover{transform:translate(-50%,-50%) scale(1.04);box-shadow:0 14px 30px rgba(180,42,92,.38), inset 0 0 0 3px #fff}
.hub:focus-visible{outline:4px solid var(--rose);outline-offset:4px}
.hub:disabled{cursor:wait}
.hub svg{width:24%;height:auto}
.hub .go{font-family:'Aref Ruqaa',var(--head);font-weight:700;font-size:clamp(17px,4.2vw,26px);line-height:1.15}
.hub .en{font-family:'Great Vibes',cursive;font-size:clamp(11px,2.6vw,15px);color:var(--rose);direction:ltr}
.hint{margin-top:16px;font-size:14px;color:#6B3A50;text-align:center;min-height:22px}

/* ---------- popup ---------- */
.overlay{position:fixed;inset:0;background:rgba(74,29,51,.45);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.overlay.open{display:flex;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{
  position:relative;width:min(100%,520px);max-height:calc(100vh - 32px);overflow:auto;border-radius:28px;padding:26px 22px 22px;
  background:linear-gradient(180deg,#FFFFFF 0%,#FFF2F6 100%);box-shadow:0 24px 60px rgba(74,29,51,.35);
  animation:pop .28s cubic-bezier(.2,1.4,.4,1)
}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.close{position:absolute;top:12px;left:12px;width:44px;height:44px;border-radius:50%;border:0;background:var(--blush);color:var(--deep);font-size:24px;cursor:pointer;line-height:1}
.close:focus-visible,.btn:focus-visible,textarea:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--blush);color:var(--deep);border-radius:99px;padding:4px 14px 4px 6px;font-weight:700;font-size:14px}
.badge i{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:linear-gradient(150deg,var(--rose),var(--deep));color:#fff;font-style:normal;font-family:var(--head)}
.q{font-family:var(--head);color:var(--deep);font-size:clamp(24px,5.6vw,30px);line-height:1.35;margin:14px 0 12px}
label{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
textarea{width:100%;min-height:92px;resize:vertical;border-radius:16px;border:1.5px solid #F4B6C8;background:#fff;padding:12px 14px;font:16px/1.6 var(--body);color:var(--plum)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{flex:1 1 180px;min-height:48px;border:0;border-radius:16px;padding:12px 16px;font:600 17px var(--body);cursor:pointer;color:#fff;background:linear-gradient(150deg,var(--rose),var(--deep));box-shadow:0 10px 22px rgba(180,42,92,.25)}
.btn.alt{background:#fff;color:var(--deep);box-shadow:0 0 0 1.5px #F4B6C8 inset}
.answer{display:none;margin-top:16px;border-radius:18px;padding:14px 16px;background:#F1F7F3;border:1.5px solid #CFE3D6}
.answer.show{display:block;animation:fade .25s ease}
.answer b{display:block;color:var(--sage);font-size:15px;margin-bottom:4px}
.answer p{margin:0;font-size:17px;line-height:1.7}
.mine{margin-top:10px;font-size:14px;color:#6B3A50}
.prize{text-align:center}
.prize .big{font-family:'Aref Ruqaa',var(--head);color:var(--deep);font-size:44px;line-height:1.3;margin:6px 0}

<script>
// ---------- data: the 8 questions from the printed Awareness Wheel ----------
const SEGMENTS = [
  { l1: "متى أبدأ فحص", l2: "الماموغرام؟", a: "من سن ٤٠ تقريباً، كل ١–٢ سنة حسب توصية الطبيب (وأبكر لمن لديها خطر مرتفع)." },
  { l1: "اذكري علامتين", l2: "لسرطان الثدي", a: "كتلة، تغيّر الشكل، تنقّر الجلد، انكماش الحلمة، إفرازات، احمرار (أي اثنتين)." },
  { l1: "هل يُصاب الرجال", l2: "بسرطان الثدي؟", a: "نعم، نادراً: نحو ١٪ من الحالات." },
  { l1: "متى أفضل وقت", l2: "للفحص الذاتي؟", a: "مرة شهرياً، بعد انتهاء الدورة بـ٣–٥ أيام." },
  { l1: "اذكري عادة صحية", l2: "تقلّل الخطر", a: "النشاط البدني، الوزن الصحي، الغذاء المتوازن، الرضاعة الطبيعية، تجنّب التدخين." },
  { l1: "هل كل كتلة", l2: "في الثدي سرطان؟", a: "لا، معظم الكتل حميدة، لكن أي كتلة جديدة تحتاج فحصاً." },
  { l1: "ماذا يرمز", l2: "الشريط الوردي؟", a: "رمز عالمي للتوعية بسرطان الثدي ودعم المصابات والناجيات." },
  { l1: "جائزة!", l2: "اكتبي رسالة دعم", a: "اكتبي رسالة على جدار الأمل واحصلي على دبوس الحملة.", prize: true },
];
const FILLS = ["#F48FB1", "#FFF4F7", "#E8618C", "#FDE1EA", "#F7A0B8", "#FFF8F3", "#C2185B", "#FBD3DF"];
const DARK = new Set(["#F48FB1", "#E8618C", "#C2185B"]);
const AR_DIGITS = "١٢٣٤٥٦٧٨";
const N = SEGMENTS.length, STEP = 360 / N;

// ---------- draw the wheel ----------
const NS = "http://www.w3.org/2000/svg";
const wheel = document.getElementById("wheel");
const CX = 400, CY = 400, R = 352;
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || wheel).appendChild(e);
  return e;
}
function pt(angle, r) { const t = (angle - 90) * Math.PI / 180; return [CX + r * Math.cos(t), CY + r * Math.sin(t)]; }
function heart(cx, cy, s) {
  return `M${cx} ${cy + s * .9} C ${cx - s * 1.1} ${cy + s * .1} ${cx - s * 1.05} ${cy - s * .75} ${cx - s * .5} ${cy - s * .8} ` +
         `C ${cx - s * .2} ${cy - s * .83} ${cx} ${cy - s * .55} ${cx} ${cy - s * .4} C ${cx} ${cy - s * .55} ${cx + s * .2} ${cy - s * .83} ${cx + s * .5} ${cy - s * .8} ` +
         `C ${cx + s * 1.05} ${cy - s * .75} ${cx + s * 1.1} ${cy + s * .1} ${cx} ${cy + s * .9} Z`;
}
const defs = el("defs", {});
const gold = el("linearGradient", { id: "goldG", x1: 0, y1: 0, x2: 1, y2: 1 }, defs);
[["0", "#E8B9A0"], [".5", "#C98C6E"], ["1", "#F1CDB8"]].forEach(([o, c]) => el("stop", { offset: o, "stop-color": c }, gold));
el("circle", { cx: CX, cy: CY, r: R + 32, fill: "#fff", stroke: "url(#goldG)", "stroke-width": 6 });
SEGMENTS.forEach((s, k) => {
  const a0 = k * STEP - STEP / 2, a1 = k * STEP + STEP / 2;
  const [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R);
  el("path", { d: `M${CX} ${CY} L${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z`, fill: FILLS[k], stroke: "#fff", "stroke-width": 4 });
  const dark = DARK.has(FILLS[k]), tc = dark ? "#FFFFFF" : "#4A1D33";
  const g = el("g", { transform: `rotate(${k * STEP} ${CX} ${CY})` });
  el("circle", { cx: CX, cy: CY - R + 46, r: 24, fill: dark ? "#FFFFFF" : "#B42A5C" }, g);
  const n = el("text", { x: CX, y: CY - R + 54, "text-anchor": "middle", "font-size": 24, fill: dark ? "#B42A5C" : "#FFFFFF" }, g); n.textContent = AR_DIGITS[k];
  const t1 = el("text", { x: CX, y: CY - 250, "text-anchor": "middle", direction: "rtl", "font-size": 21, fill: tc }, g); t1.textContent = s.l1;
  const t2 = el("text", { x: CX, y: CY - 220, "text-anchor": "middle", direction: "rtl", "font-size": 21, fill: tc }, g); t2.textContent = s.l2;
  el("path", { d: heart(CX, CY - 170, 9), fill: tc, opacity: .6 }, g);
});
for (let a = 0; a < 360; a += 15) { const [x, y] = pt(a, R + 18); el("circle", { cx: x.toFixed(2), cy: y.toFixed(2), r: 6, fill: "url(#goldG)" }); }

// ---------- spin ----------
const spinBtn = document.getElementById("spin"), hint = document.getElementById("hint"), pointer = document.getElementById("pointer");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let rotation = 0, spinning = false, last = -1;

function rand(max) {
  if (window.crypto && crypto.getRandomValues) { const u = new Uint32Array(1); crypto.getRandomValues(u); return u[0] % max; }
  return Math.floor(Math.random() * max);
}
function spin() {
  if (spinning) return;
  spinning = true; spinBtn.disabled = true; hint.textContent = "العجلة تدور…";
  let k = rand(N);
  if (k === last && N > 1) k = (k + 1 + rand(N - 1)) % N; // avoid the same question twice in a row
  last = k;
  const jitter = (rand(1000) / 1000 - 0.5) * (STEP * 0.7); // land anywhere inside the segment, not on its edge
  const current = ((rotation % 360) + 360) % 360;
  const target = (360 - k * STEP + jitter + 360) % 360;
  const turns = reduce ? 1 : 6 + rand(3);
  rotation += turns * 360 + ((target - current + 360) % 360);
  const dur = reduce ? 900 : 5200 + rand(1200);
  wheel.style.transition = `transform ${dur}ms cubic-bezier(.12,.72,.08,1)`;
  wheel.style.transform = `rotate(${rotation}deg)`;
  tickWhileSpinning(dur);
  setTimeout(() => { spinning = false; spinBtn.disabled = false; hint.textContent = ""; openCard(k); }, dur + 120);
}
function tickWhileSpinning(dur) {
  if (reduce) return;
  const start = performance.now(); let lastSeg = null;
  (function frame(now) {
    const m = getComputedStyle(wheel).transform;
    if (m && m !== "none") {
      const [a, b] = m.slice(7, -1).split(",").map(Number);
      const ang = ((Math.atan2(b, a) * 180 / Math.PI) + 360) % 360;
      const seg = Math.floor(((360 - ang + STEP / 2) % 360) / STEP);
      if (seg !== lastSeg) { lastSeg = seg; pointer.classList.remove("tick"); void pointer.offsetWidth; pointer.classList.add("tick"); }
    }
    if (now - start < dur) requestAnimationFrame(frame);
  })(start);
}
spinBtn.addEventListener("click", spin);

// ---------- popup ----------
const overlay = document.getElementById("overlay"), content = document.getElementById("content"), closeBtn = document.getElementById("close");
let lastFocus = null;
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function openCard(k) {
  const s = SEGMENTS[k];
  lastFocus = document.activeElement;
  if (s.prize) {
    content.innerHTML = `
      <div class="prize">
        <span class="badge"><i>${AR_DIGITS[k]}</i> مبروك!</span>
        <div class="big" id="qtitle">${esc(s.l1)}</div>
        <p><b>${esc(s.l2)}</b></p>
        <p>${esc(s.a)}</p>
        <div class="row"><button class="btn" type="button" data-act="again">لفّة جديدة</button></div>
      </div>`;
    hearts();
  } else {
    content.innerHTML = `
      <span class="badge"><i>${AR_DIGITS[k]}</i> سؤال التوعية</span>
      <h2 class="q" id="qtitle">${esc(s.l1)} ${esc(s.l2)}</h2>
      <label for="ans">إجابتكِ</label>
      <textarea id="ans" placeholder="اكتبي إجابتكِ هنا…"></textarea>
      <div class="row">
        <button class="btn" type="button" data-act="reveal">اعرضي الإجابة الصحيحة</button>
        <button class="btn alt" type="button" data-act="again">لفّة جديدة</button>
      </div>
      <div class="answer" id="answer" aria-live="polite">
        <b>الإجابة الصحيحة</b>
        <p>${esc(s.a)}</p>
        <div class="mine" id="mine"></div>
      </div>`;
  }
  overlay.classList.add("open"); overlay.setAttribute("aria-hidden", "false");
  (content.querySelector("textarea") || content.querySelector(".btn")).focus();
}
function closeCard() {
  overlay.classList.remove("open"); overlay.setAttribute("aria-hidden", "true");
  if (lastFocus) lastFocus.focus();
}
content.addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act === "reveal") {
    const box = document.getElementById("answer"), mine = document.getElementById("mine"), v = document.getElementById("ans").value.trim();
    mine.textContent = v ? "إجابتكِ: " + v : "";
    box.classList.add("show"); e.target.textContent = "أحسنتِ!"; e.target.disabled = true;
  } else if (act === "again") { closeCard(); setTimeout(spin, 250); }
});
closeBtn.addEventListener("click", closeCard);
overlay.addEventListener("click", (e) => { if (e.target === overlay) closeCard(); });
document.addEventListener("keydown", (e) => {
  if (!overlay.classList.contains("open")) return;
  if (e.key === "Escape") closeCard();
  if (e.key === "Tab") { // keep focus inside the popup
    const f = [...overlay.querySelectorAll("button:not([disabled]),textarea")];
    if (!f.length) return;
    const first = f[0], lastEl = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); lastEl.focus(); }
    else if (!e.shiftKey && document.activeElement === lastEl) { e.preventDefault(); first.focus(); }
  }
});
function hearts() {
  if (reduce) return;
  for (let i = 0; i < 26; i++) {
    const h = document.createElement("div"); h.className = "heart";
    const size = 14 + rand(18);
    h.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 22"><path d="M12 21C5 15 1 11 1 7A5.5 5.5 0 0 1 12 4.5 5.5 5.5 0 0 1 23 7c0 4-4 8-11 14z" fill="${["#F06292", "#E8618C", "#F7A0B8", "#C2185B"][rand(4)]}"/></svg>`;
    h.style.left = rand(100) + "vw"; h.style.animationDuration = (2.2 + rand(20) / 10) + "s"; h.style.animationDelay = (rand(8) / 10) + "s";
    document.body.appendChild(h); setTimeout(() => h.remove(), 5200);
  }
}
</script>
